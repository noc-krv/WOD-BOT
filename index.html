<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WO 战术板</title>
  <!-- 引入极速压缩库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <style>
    :root {
      --bg: #0f0f13; --panel: #17171c; --card: #222229; --card-hover: #2a2a33;
      --line: #2f2f38; --line-strong: #454552; --text: #ececf1; --muted: #8b8b9a;
      --accent: #00d9ff; --accent-dim: rgba(0, 217, 255, 0.12);
      --warn: #ffc857; --danger: #ff5c5c; --success: #4ade80;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 顶部栏 */
    .top-bar { display: flex; flex-direction: column; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: rgba(15, 15, 19, 0.96); z-index: 20; flex-shrink: 0; }
    .title-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title-row h1 { margin: 0; font-size: 20px; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
    .dungeon-input { background: transparent; border: 1px dashed var(--line-strong); color: #fff; font-size: 16px; font-weight: bold; padding: 6px 12px; border-radius: 6px; outline: none; width: 200px; transition: border-color 0.2s; }
    .dungeon-input:focus { border-color: var(--accent); }
    .dungeon-input:disabled { border: none; background: transparent; cursor: default; }
    
    .view-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); padding: 0 20px; flex-shrink: 0; background: var(--panel); }
    .view-tab { padding: 12px 20px; background: transparent; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .main-content { flex: 1; overflow: hidden; position: relative; }

    /* 视图1：正方形大沙盘 */
    #viewDeploy { height: 100%; display: flex; padding: 20px; overflow: hidden; }
    .deploy-center { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
    
    .cross-container { 
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: 1fr 2fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 1000px;
      height: 80vh; 
      max-height: 900px;
    }
    
    .position-group { 
      border: 2px solid #4CAF50; 
      border-radius: 10px; 
      background: var(--panel); 
      display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; 
      align-content: flex-start; justify-content: center;
      position: relative; padding: 45px 15px 15px 15px; 
      overflow-y: auto;
    }
    .pos-front { grid-column: 1 / -1; grid-row: 1; }
    .pos-left { grid-column: 1; grid-row: 2; }
    .pos-middle { grid-column: 2; grid-row: 2; border-color: var(--accent); }
    .pos-right { grid-column: 3; grid-row: 2; }
    .pos-back { grid-column: 1 / -1; grid-row: 3; border-color: #FF9800; }

    .position-group h3 { position: absolute; top: 12px; left: 0; width: 100%; text-align: center; color: #8bc34a; margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .pos-back h3 { color: #FF9800; }
    .pos-middle h3 { color: var(--accent); }

    .player-card { background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 12px; cursor: pointer; transition: all 0.2s; position: relative; width: 120px; flex-shrink: 0; }
    .player-card:hover { border-color: var(--accent); background: var(--card-hover); transform: translateY(-2px); }
    .player-card .name { font-size: 1em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-card .class { font-size: 0.75em; color: var(--muted); margin-top: 4px; }
    .player-card .del-btn { position: absolute; top: -8px; right: -8px; color: #fff; background: var(--danger); border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; padding: 0; z-index: 10; }
    .player-card:hover .del-btn { opacity: 1; }

    .add-btn { background: rgba(255,255,255,0.03); border: 1px dashed var(--line-strong); color: var(--muted); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: all 0.2s; font-size: 24px; display: flex; align-items: center; justify-content: center; margin: auto; }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); transform: scale(1.1); }

    /* 视图2：战术编排 */
    #viewTactics { padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 1200px; margin: 0 auto; height: 100%; overflow-y: auto; }
    .phase-control-bar { display: flex; align-items: center; justify-content: space-between; background: var(--panel); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--line); flex-wrap: wrap; gap: 10px; }
    .phase-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .phase-btn { min-width: 52px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: #1c1c23; color: var(--muted); font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: inherit; font-weight: 600; }
    .phase-btn:hover { border-color: #66667a; color: var(--text); }
    .phase-btn.active { background: var(--accent); border-color: var(--accent); color: #001014; font-weight: 800; }

    .tactic-list { display: flex; flex-direction: column; gap: 12px; }
    .tactic-group { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .tactic-group-header { background: #1c1c23; padding: 8px 15px; font-size: 13px; font-weight: 700; color: #8bc34a; border-bottom: 1px solid var(--line); }
    .tactic-header-row { display: flex; align-items: center; padding: 8px 15px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); font-weight: bold; }
    .tactic-row { display: flex; align-items: flex-start; padding: 10px 15px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.2s; }
    .tactic-row:last-child { border-bottom: none; }
    .tactic-row:hover { background: var(--card-hover); }
    
    .col-name { width: 100px; flex-shrink: 0; font-weight: 700; font-size: 14px; color: var(--text); }
    .col-class { width: 80px; flex-shrink: 0; font-size: 13px; color: var(--muted); }
    .col-timing { width: 60px; flex-shrink: 0; }
    .col-skill { width: 150px; flex-shrink: 0; font-size: 14px; font-weight: bold; color: var(--warn); }
    .col-item { width: 120px; flex-shrink: 0; font-size: 13px; }
    .col-target { width: 100px; flex-shrink: 0; font-size: 13px; color: var(--accent); } 
    .col-remark { flex: 1; font-size: 13px; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; }

    .tag-timing { font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; text-align: center; width: 40px; }
    .tag-timing.AM { background: rgba(255, 200, 87, 0.15); color: var(--warn); }
    .tag-timing.PM { background: rgba(0, 217, 255, 0.15); color: var(--accent); }
    .tag-empty { color: var(--muted); font-size: 12px; font-style: italic; }
    .tag-item { font-size: 12px; color: var(--success); border: 1px solid var(--success); padding: 1px 4px; border-radius: 4px; display: inline-block; }

    /* 通用组件与弹窗 */
    .btn { background: #26262e; color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: all 0.15s; font-family: inherit; font-weight: 600; }
    .btn:hover { border-color: #66667a; background: #2f2f38; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #001014; }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.block { width: 100%; }
    .btn.danger { background: rgba(255,92,92,0.1); border-color: var(--danger); color: var(--danger); }
    input[type="text"], select, textarea { width: 100%; background: #1c1c23; color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none; resize: vertical; }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field > label { font-weight: 700; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .radio-row { display: flex; gap: 16px; }
    .radio { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #ccc; cursor: pointer; }
    .radio input { accent-color: var(--accent); }

    .mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
    .mask.show { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 460px; max-width: 92vw; background: #141418; border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; transform: translateX(105%); transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1); z-index: 60; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .drawer-title { font-size: 18px; font-weight: 800; }
    .drawer-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .icon-btn { background: transparent; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .icon-btn:hover { color: var(--text); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
    .drawer-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; }

    .action-card { background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .action-card .a-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .action-card .btn-del-action { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 16px; }

    .modal-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 80; }
    .modal-mask.show { opacity: 1; pointer-events: auto; }
    .modal { width: 800px; max-width: 95vw; height: 80vh; background: #141418; border: 1px solid var(--line-strong); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font-size: 16px; }
    
    .lib-tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 20px; background: #17171c; }
    .lib-tab { padding: 12px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
    .lib-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .modal-body { flex: 1; display: flex; overflow: hidden; }
    .lib-sidebar { width: 200px; border-right: 1px solid var(--line); overflow-y: auto; background: #17171c; padding: 10px; }
    .lib-class-btn { width: 100%; text-align: left; padding: 10px; background: transparent; border: none; color: var(--muted); cursor: pointer; border-radius: 6px; }
    .lib-class-btn:hover { background: var(--card); color: var(--text); }
    .lib-class-btn.active { background: var(--accent-dim); color: var(--accent); font-weight: 700; }
    .lib-content { flex: 1; padding: 20px; overflow-y: auto; }
    .lib-content h4 { margin: 0 0 16px; color: var(--accent); }
    
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .skill-card { background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; position: relative; display: flex; flex-direction: column; gap: 6px; }
    .skill-card .s-name { font-size: 14px; font-weight: 700; color: var(--warn); }
    .skill-card .s-item { font-size: 12px; color: var(--success); }
    .skill-card .btn-del-skill { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; }
    .skill-card:hover .btn-del-skill { opacity: 1; }
    .add-skill-form { margin-top: 20px; border-top: 1px dashed var(--line-strong); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .add-skill-row { display: flex; gap: 10px; align-items: flex-end; }

    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .roster-card { background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px; position: relative; display: flex; flex-direction: column; gap: 4px; }
    .roster-card .r-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .roster-card .r-class { font-size: 12px; color: var(--muted); }
    .roster-card .btn-del-roster { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; }
    .roster-card:hover .btn-del-roster { opacity: 1; }

    #shareModal { width: 600px; height: auto; max-height: 90vh; }
    #shareModal .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }

    #toastBox { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 120; pointer-events: none; }
    .toast { padding: 12px 24px; border-radius: 8px; background: #1c1c23; border: 1px solid var(--line-strong); font-size: 14px; font-weight: 600; animation: toastIn 0.2s ease; }
    .toast.ok { border-color: var(--success); color: var(--success); }
    .toast.warn { border-color: var(--warn); color: var(--warn); }
    .toast.error { border-color: var(--danger); color: #ff8a8a; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="title-row">
      <div style="display:flex; align-items:center; gap:15px;">
        <h1>WO 战术板</h1>
        <input type="text" id="dungeonName" class="dungeon-input" placeholder="输入副本名称..." value="未命名副本">
      </div>
      <div style="display:flex; gap:10px;" id="adminToolbar">
        <button class="btn" id="shareBtn" style="color:var(--accent); border-color:var(--accent);">🔗 生成分享链接</button>
        <button class="btn" id="exportBtn">📤 全量导出备份</button>
        <button class="btn" id="importBtn">📥 全量导入备份</button>
        <input type="file" id="importFile" style="display:none;" accept=".json">
        <button class="btn" id="openLibBtn">⚙️ 战术库配置</button>
        <button class="btn" id="resetBtn" style="color:var(--danger); border-color:var(--danger);">清空数据</button>
      </div>
    </div>
  </header>

  <div class="view-tabs">
    <button class="view-tab active" data-view="deploy">1. 排兵布阵</button>
    <button class="view-tab" data-view="tactics">2. 战术编排 (F1-F10)</button>
  </div>

  <main class="main-content">
    <div id="viewDeploy" hidden>
      <div class="deploy-center"><div class="cross-container" id="deploySandbox"></div></div>
    </div>

    <div id="viewTactics" hidden>
      <div class="phase-control-bar">
        <div class="phase-list" id="phaseBar"></div>
        <button class="btn" id="phaseSettingsBtn" style="padding: 4px 10px; font-size: 12px;">⚙️ 启用阶段</button>
      </div>
      <div class="tactic-list" id="tacticList"></div>
    </div>
  </main>

  <div class="mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div><div class="drawer-title" id="drawerTitle">新建队员</div><div class="drawer-sub" id="drawerSub">配置</div></div>
      <button class="icon-btn" id="drawerClose">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFooter"></div>
  </aside>

  <div class="modal-mask" id="libMask">
    <div class="modal">
      <div class="modal-head"><h3>战术库配置</h3><button class="icon-btn" id="closeLibBtn">&times;</button></div>
      <div class="lib-tabs">
        <button class="lib-tab active" data-libtab="roster">📇 人员名册库</button>
        <button class="lib-tab" data-libtab="skills">📚 职业技能库</button>
        <button class="lib-tab" data-libtab="data" style="color:var(--warn);">💾 数据管理</button>
      </div>
      <div class="modal-body" id="libBody"></div>
    </div>
  </div>

  <div class="modal-mask" id="shareMask">
    <div class="modal" id="shareModal">
      <div class="modal-head"><h3>生成战术分享链接</h3><button class="icon-btn" id="closeShareBtn">&times;</button></div>
      <div class="modal-body">
        <p style="font-size:14px; color:var(--text); line-height:1.6; margin:0;">
          请点击下方按钮复制<b>专属分享链接</b>。<br>
          发给队友后，队友用浏览器打开链接，即可<b>直接查看战术（自动进入只读模式）</b>。
        </p>
        <textarea id="shareCodeText" rows="4" style="font-family:monospace; font-size:12px; color:var(--accent); background:#0f0f13;" readonly placeholder="链接生成中..."></textarea>
        <button class="btn primary block" id="copyShareCodeBtn" style="padding:12px; font-size:15px;">📋 一键复制完整分享链接</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="phaseMask">
    <div class="modal" style="width: 400px; height: auto;">
      <div class="modal-head"><h3>选择使用的阶段</h3><button class="icon-btn" id="closePhaseBtn">&times;</button></div>
      <div style="padding: 20px; display: flex; flex-wrap: wrap; gap: 15px;" id="phaseCheckboxes"></div>
      <div style="padding: 0 20px 20px; text-align: right;"><button class="btn primary" id="savePhaseBtn">确定</button></div>
    </div>
  </div>

  <div id="toastBox"></div>

  <script>
    const STORAGE_KEY = 'wo-tactics-board-v36';
    const ALL_PHASES = ['F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10'];
    const POSITIONS = ['前', '左', '中', '右', '后'];
    const CLASS_NAMES = ['圣武士', '角斗士', '野蛮人', '骑士', '杂耍艺人', '法师', '死灵师', '萨满', '猎人', '射手', '漂泊客', '学者', '祭司', '舞者', '吟游诗人', '炼金术士', '其他'];

    let db = { dungeonName: '未命名副本', activePhases: ['F1', 'F2', 'F3'], roster: [], library: {}, players: [], actions: {} };
    CLASS_NAMES.forEach(n => db.library[n] = []);

    let isViewMode = false, currentView = 'deploy', currentPhase = 'F1', currentPlayer = null;
    let drawerMode = 'deploy', playerDraft = {}, actionsDraft = [], isAddingAction = false, currentActionDraft = {};
    let currentLibClass = CLASS_NAMES[0], currentLibTab = 'roster';

    const $ = id => document.getElementById(id);
    const deploySandbox = $('deploySandbox'), tacticList = $('tacticList'), phaseBar = $('phaseBar');
    const drawer = $('drawer'), drawerMask = $('drawerMask'), drawerTitle = $('drawerTitle'), drawerSub = $('drawerSub'), drawerBody = $('drawerBody');
    const libMask = $('libMask'), libBody = $('libBody'), toastBox = $('toastBox');

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function cleanData(d) {
      if (!d.library) d.library = {};
      if (d.library['死灵术士']) { d.library['死灵师'] = d.library['死灵术士']; delete d.library['死灵术士']; }
      if (d.library['炼金术师']) { d.library['炼金术士'] = d.library['炼金术师']; delete d.library['炼金术师']; }

      const fixC = c => c === '死灵术士' ? '死灵师' : c === '炼金术师' ? '炼金术士' : c;
      const posMap = { '前排': '前', '左翼': '左', '中间': '中', '右翼': '右', '后排': '后', '队后': '后' };
      const fixP = p => posMap[p] || (POSITIONS.includes(p) ? p : '中');

      if (d.roster) d.roster = d.roster.filter(r => r && r.name).map(r => ({...r, class: fixC(r.class)}));
      
      if (d.players) {
        d.players = d.players.filter(p => p && p.name && p.class).map(p => ({...p, class: fixC(p.class), position: fixP(p.position)}));
        d.players = d.players.slice(0, 12);
      }

      if (d.library) {
        Object.keys(d.library).forEach(c => {
          if (!Array.isArray(d.library[c])) d.library[c] = [];
          d.library[c].forEach(s => {
            if (s.itemName && !s.items) { s.items = [s.itemName]; delete s.itemName; }
          });
        });
      }

      if (d.actions) {
        Object.keys(d.actions).forEach(ph => {
          Object.keys(d.actions[ph]).forEach(id => {
            const a = d.actions[ph][id];
            if (a && !Array.isArray(a)) d.actions[ph][id] = !a.skillId ? [] : [a];
          });
        });
      }
      return d;
    }

    function load() {
      const hash = new URLSearchParams(window.location.hash.substring(1)).get('data');
      if (hash) {
        isViewMode = true;
        try { 
          // 【核心修复】使用极速解压
          const decompressed = LZString.decompressFromEncodedURIComponent(hash);
          Object.assign(db, cleanData(JSON.parse(decompressed))); 
          toast('🔗 只读模式已加载', 'ok'); 
        } catch(e) { 
          toast('分享链接损坏', 'error'); 
          console.error(e);
        }
      } else {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) Object.assign(db, cleanData(JSON.parse(raw)));
        } catch(e) {}
      }
      
      CLASS_NAMES.forEach(n => { if (!Array.isArray(db.library[n])) db.library[n] = []; });
      $('dungeonName').value = db.dungeonName;
      if (!db.activePhases.includes(currentPhase)) currentPhase = db.activePhases[0] || 'F1';

      if (isViewMode) {
        $('adminToolbar').style.display = 'none';
        $('phaseSettingsBtn').style.display = 'none';
        $('dungeonName').disabled = true;
        const st = document.createElement('style');
        st.innerHTML = `.player-card,.tactic-row{pointer-events:none}.player-card .del-btn,.add-btn{display:none}`;
        document.head.appendChild(st);
      }
    }

    function save() {
      if (!isViewMode) localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = 'toast ' + (type || 'ok');
      el.textContent = msg;
      toastBox.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
      $('viewDeploy').hidden = view !== 'deploy';
      $('viewTactics').hidden = view !== 'tactics';
      if (view === 'deploy') renderDeploy(); else renderTactics();
    }

    function renderDeploy() {
      deploySandbox.innerHTML = ['前', '左', '中', '右', '后'].map(pos => {
        const list = db.players.filter(p => p.position === pos);
        const posClass = pos === '前' ? 'front' : pos === '后' ? 'back' : pos === '左' ? 'left' : pos === '右' ? 'right' : 'middle';
        const displayName = pos === '左' ? '左翼' : pos === '右' ? '右翼' : pos === '前' ? '前排' : pos === '中' ? '中间' : '后排';
        return `
          <section class="position-group pos-${posClass}" data-pos="${pos}">
            <h3>${displayName}</h3>
            ${list.map(p => `
              <div class="player-card" data-id="${p.id}">
                <button class="del-btn" data-del="${p.id}">×</button>
                <div class="name">${esc(p.name)}</div>
                <div class="class">${esc(p.class)}</div>
              </div>
            `).join('')}
            <button class="add-btn" data-add="${pos}">+</button>
          </section>
        `;
      }).join('');
    }

    function renderTactics() {
      phaseBar.innerHTML = db.activePhases.map(p => `<button class="phase-btn${p === currentPhase ? ' active' : ''}" data-phase="${p}">${p}</button>`).join('');
      
      tacticList.innerHTML = POSITIONS.map(pos => {
        const list = db.players.filter(p => p.position === pos);
        if (!list.length) return '';
        const displayName = pos === '左' ? '左翼' : pos === '右' ? '右翼' : pos === '前' ? '前排' : pos === '中' ? '中间' : '后排';
        return `
          <div class="tactic-group">
            <div class="tactic-group-header">${displayName}</div>
            <div class="tactic-header-row"><div class="col-name"></div><div class="col-class"></div><div class="col-timing">时机</div><div class="col-skill">技能</div><div class="col-item">物品</div><div class="col-target">使用位置</div><div class="col-remark">备注</div></div>
            ${list.map(p => {
              const acts = db.actions[currentPhase]?.[p.id] || [];
              return `
                <div class="tactic-row" data-id="${p.id}">
                  <div class="col-name" style="padding-top:4px;">${esc(p.name)}</div>
                  <div class="col-class" style="padding-top:4px;">${esc(p.class)}</div>
                  <div style="flex:1; display:flex; flex-direction:column;">
                    ${acts.length === 0 ? `<div class="col-timing"><span class="tag-empty">-</span></div><div class="col-skill"><span class="tag-empty">-</span></div><div class="col-item"><span class="tag-empty">-</span></div><div class="col-target"><span class="tag-empty">-</span></div><div class="col-remark"></div>` : ''}
                    ${acts.map((act, i) => {
                      const sk = db.library[p.class]?.find(s => s.id === act.skillId);
                      return `
                        <div style="display:flex;width:100%;align-items:center;${i===acts.length-1?'':'padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed #333;'}">
                          <div class="col-timing"><span class="tag-timing ${act.timing}">${act.timing}</span></div>
                          <div class="col-skill"><span style="color:var(--warn);font-weight:bold;">${esc(sk?sk.name:'?')}</span></div>
                          <div class="col-item">${act.item?`<span class="tag-item">${esc(act.item)}</span>`:'<span class="tag-empty">-</span>'}</div>
                          <div class="col-target"><span style="color:var(--accent);">${esc(act.target)}</span></div>
                          <div class="col-remark"><span style="font-style:italic;">${esc(act.remark||'')}</span></div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    function openDrawer(player = null, position = null, mode = 'deploy') {
      if (isViewMode) return;
      drawerMode = mode;
      if (mode === 'deploy') {
        isAddingAction = false;
        currentPlayer = player;
        playerDraft = player ? { name: player.name, class: player.class, position: player.position } : { name: '', class: CLASS_NAMES[0], position: position };
        drawerTitle.textContent = player ? '修改队员信息' : '添加新队员';
        drawerSub.textContent = `入驻位置：${position || (player && player.position)}`;
      } else {
        currentPlayer = player;
        actionsDraft = JSON.parse(JSON.stringify(db.actions[currentPhase]?.[player.id] || []));
        isAddingAction = false; currentActionDraft = {}; 
        drawerTitle.textContent = player.name;
        drawerSub.textContent = `${player.class} · ${currentPhase} 阶段`;
      }
      renderDrawerBody();
      drawer.classList.add('open'); drawerMask.classList.add('show');
    }

    function closeDrawer() {
      drawer.classList.remove('open'); drawerMask.classList.remove('show');
    }

    function renderDrawerBody() {
      if (drawerMode === 'deploy') {
        const rosterOpts = '<option value="">-- 选择名册 --</option>' + db.roster.map(r => {
          const exist = db.players.find(p => p.name === r.name && p.id !== currentPlayer?.id);
          return exist ? `<option disabled>${esc(r.name)} (已在${esc(exist.position)})</option>` : `<option value="${r.id}">${esc(r.name)} (${esc(r.class)})</option>`;
        }).join('');

        drawerBody.innerHTML = `
          <div class="field" style="background:var(--accent-dim);border:1px solid rgba(0,217,255,0.3);padding:10px;border-radius:6px;margin-bottom:20px;">
            <label style="color:var(--accent);">⚡ 快捷选择</label>
            <select id="rosterSelect">${rosterOpts}</select>
          </div>
          <div class="field"><label>名字</label><input type="text" id="playerNameInput" data-field="name" value="${esc(playerDraft.name)}"></div>
          <div class="field"><label>职业</label><select id="playerClassInput" data-field="class">${CLASS_NAMES.map(c => `<option value="${c}"${playerDraft.class===c?' selected':''}>${c}</option>`).join('')}</select></div>
          <div class="field"><label>固定站位</label><select data-field="position">${POSITIONS.map(p => `<option value="${p}"${playerDraft.position===p?' selected':''}>${p}</option>`).join('')}</select></div>
        `;

        const rs = $('rosterSelect');
        if (rs) rs.onchange = e => {
          const tr = db.roster.find(r => r.id === e.target.value);
          if (tr) { $('playerNameInput').value = tr.name; $('playerClassInput').value = tr.class; playerDraft.name = tr.name; playerDraft.class = tr.class; }
        };

        $('drawerFooter').innerHTML = `
          <button class="btn danger" id="deletePlayerBtn" style="display:${currentPlayer?'block':'none'};">移除队员</button>
          <button class="btn primary block" id="saveBtn">保存部署</button>
        `;
        $('saveBtn').onclick = () => {
          if (!playerDraft.name.trim()) return toast('请输入名字', 'warn');
          if (db.players.find(p => p.name === playerDraft.name.trim() && p.id !== currentPlayer?.id)) return toast('场上已有该队员', 'warn');
          if (!currentPlayer) db.players.push({ id: Date.now().toString(), name: playerDraft.name.trim(), class: playerDraft.class, position: playerDraft.position });
          else Object.assign(currentPlayer, { name: playerDraft.name.trim(), class: playerDraft.class, position: playerDraft.position });
          save(); closeDrawer(); renderDeploy(); toast('保存成功', 'ok');
        };
        $('deletePlayerBtn').onclick = () => {
          db.players = db.players.filter(p => p.id !== currentPlayer.id);
          Object.keys(db.actions).forEach(ph => delete db.actions[ph][currentPlayer.id]);
          save(); closeDrawer(); renderDeploy(); toast('已移出', 'ok');
        };
        return;
      }

      const skills = db.library[currentPlayer.class] || [];
      let listHtml = actionsDraft.map((act, i) => {
        const sk = skills.find(s => s.id === act.skillId);
        return `<div class="action-card"><div class="a-info"><span class="tag-timing ${act.timing}">${act.timing}</span><strong style="color:var(--warn);">${esc(sk?sk.name:'?')}</strong>${act.item?`<span class="tag-item">${esc(act.item)}</span>`:''}<span style="color:var(--accent);">→ ${esc(act.target)}</span>${act.remark?`<span style="color:var(--muted);font-size:12px;">(${esc(act.remark)})</span>`:''}</div><button class="btn-del-action" data-del="${i}">×</button></div>`;
      }).join('') || '<div style="color:var(--muted);font-size:13px;margin-bottom:20px;">暂无动作</div>';

      let formHtml = '';
      if (isAddingAction) {
        if (!currentActionDraft.skillId) currentActionDraft = { timing: 'AM', skillId: null, item: '', target: '前', remark: '' };
        const selSk = skills.find(s => s.id === currentActionDraft.skillId);
        let itemHtml = '';
        if (selSk && selSk.depType !== 'none' && selSk.items && selSk.items.length > 0) {
          if (selSk.depType === 'required' && selSk.items.length === 1 && !currentActionDraft.item) currentActionDraft.item = selSk.items[0];
          itemHtml = `<div class="field"><label>${selSk.depType==='required'?'强制消耗':'可选物品'}</label><select data-afield="item">${selSk.depType==='optional'?'<option value="">-- 不附加 --</option>':''}${selSk.items.map(it => `<option value="${it}"${currentActionDraft.item===it?' selected':''}>${esc(it)}</option>`).join('')}</select></div>`;
        }
        formHtml = `
          <div style="background:#1c1c23;padding:15px;border-radius:8px;border:1px solid var(--accent);margin-top:20px;">
            <h5 style="margin:0 0 12px 0;color:var(--accent);">添加动作</h5>
            <div class="field"><label>时机</label><div class="radio-row"><label class="radio"><input type="radio" name="a_timing" value="AM"${currentActionDraft.timing==='AM'?' checked':''}>AM</label><label class="radio"><input type="radio" name="a_timing" value="PM"${currentActionDraft.timing==='PM'?' checked':''}>PM</label></div></div>
            <div class="field"><label>技能</label><select data-afield="skillId"><option value="">--选择--</option>${skills.map(s => `<option value="${s.id}"${currentActionDraft.skillId===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
            ${itemHtml}
            <div class="field"><label>使用位置</label><select data-afield="target">${[...POSITIONS, '自身'].map(t => `<option value="${t}"${currentActionDraft.target===t?' selected':''}>${esc(t)}</option>`).join('')}</select></div>
            <div class="field"><label>备注</label><input type="text" data-afield="remark" value="${esc(currentActionDraft.remark)}"></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;"><button class="btn" id="cancelAddBtn">取消</button><button class="btn primary" id="confirmAddBtn">确认</button></div>
          </div>
        `;
      } else {
        formHtml = `<button class="btn primary block" id="startAddBtn" style="margin-top:20px;">+ 添加新动作</button>`;
      }

      drawerBody.innerHTML = `<div style="margin-bottom:20px;"><h4 style="color:var(--text);font-size:14px;margin:0 0 12px 0;">已配置 (${actionsDraft.length})</h4>${listHtml}</div>${formHtml}`;
      $('drawerFooter').innerHTML = `<button class="btn primary block" id="btn-save-tactics">保存战术</button>`;
    }

    drawerBody.addEventListener('click', e => {
      const t = e.target;
      if (t.id === 'startAddBtn') { isAddingAction = true; renderDrawerBody(); }
      if (t.id === 'cancelAddBtn') { isAddingAction = false; renderDrawerBody(); }
      if (t.id === 'confirmAddBtn') {
        if (!currentActionDraft.skillId) return toast('请选择技能', 'warn');
        const sk = db.library[currentPlayer.class].find(s => s.id === currentActionDraft.skillId);
        if (sk.depType === 'required' && !currentActionDraft.item) return toast('需选择物品', 'warn');
        actionsDraft.push({ ...currentActionDraft }); isAddingAction = false; renderDrawerBody();
      }
      if (t.classList.contains('btn-del-action')) {
        actionsDraft.splice(parseInt(t.dataset.del), 1); renderDrawerBody();
      }
    });

    drawerBody.addEventListener('change', e => {
      if (drawerMode === 'tactic' && isAddingAction) {
        if (e.target.name === 'a_timing') return currentActionDraft.timing = e.target.value;
        const f = e.target.dataset.afield;
        if (f === 'skillId') {
          currentActionDraft.skillId = e.target.value || null; currentActionDraft.item = '';
          const sk = db.library[currentPlayer.class].find(s => s.id === currentActionDraft.skillId);
          if (sk && sk.depType === 'required' && sk.items?.length === 1) currentActionDraft.item = sk.items[0];
          renderDrawerBody();
        } else if (f) currentActionDraft[f] = e.target.value;
      } else if (drawerMode === 'deploy' && e.target.dataset.field) {
        playerDraft[e.target.dataset.field] = e.target.value;
      }
    });

    drawerBody.addEventListener('input', e => {
      if (drawerMode === 'tactic' && isAddingAction && e.target.dataset.afield === 'remark') currentActionDraft.remark = e.target.value;
      if (drawerMode === 'deploy' && e.target.dataset.field === 'name') playerDraft.name = e.target.value;
    });

    $('drawerFooter').addEventListener('click', e => {
      if (e.target.id === 'btn-save-tactics') {
        if (isAddingAction && currentActionDraft.skillId) actionsDraft.push({ ...currentActionDraft });
        if (!db.actions[currentPhase]) db.actions[currentPhase] = {};
        db.actions[currentPhase][currentPlayer.id] = JSON.parse(JSON.stringify(actionsDraft));
        save(); closeDrawer(); renderTactics(); toast('战术已保存', 'ok');
      }
    });

    function renderLib() {
      document.querySelectorAll('.lib-tab').forEach(t => t.classList.toggle('active', t.dataset.libtab === currentLibTab));
      if (currentLibTab === 'roster') {
        libBody.innerHTML = `
          <div style="flex:1;padding:20px;overflow-y:auto;">
            <div class="roster-grid" style="margin-bottom:20px;">${db.roster.map(r => `<div class="roster-card"><button class="btn-del-roster" data-del-roster="${r.id}">×</button><div class="r-name">${esc(r.name)}</div><div class="r-class">${esc(r.class)}</div></div>`).join('') || '空'}</div>
            <div class="add-skill-form"><h4>添加队员</h4><div class="add-skill-row"><div class="field" style="flex:1;margin:0;"><input type="text" id="newRosterName" placeholder="名字"></div><div class="field" style="flex:1;margin:0;"><select id="newRosterClass">${CLASS_NAMES.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div></div><button class="btn primary" id="addRosterBtn">录入</button></div>
          </div>`;
        $('addRosterBtn').onclick = () => {
          const n = $('newRosterName').value.trim(); if (!n) return toast('请输入名字', 'warn');
          db.roster.push({ id: Date.now().toString(), name: n, class: $('newRosterClass').value });
          save(); renderLib(); toast('已录入', 'ok');
        };
        libBody.querySelectorAll('[data-del-roster]').forEach(b => b.onclick = e => { db.roster = db.roster.filter(r => r.id !== e.target.dataset.delRoster); save(); renderLib(); });
      } 
      else if (currentLibTab === 'skills') {
        const skills = db.library[currentLibClass] || [];
        libBody.innerHTML = `
          <div class="lib-sidebar">${CLASS_NAMES.map(c => `<button class="lib-class-btn${currentLibClass===c?' active':''}" data-class="${c}">${c}</button>`).join('')}</div>
          <div class="lib-content">
            <div class="skill-grid">${skills.map(s => `<div class="skill-card"><button class="btn-del-skill" data-del-skill="${s.id}">×</button><div class="s-name">${esc(s.name)}</div>${s.items?.length ? `<div class="s-item">${s.depType==='required'?'🔒':'🎲'} ${esc(s.items.join('/'))}</div>` : ''}</div>`).join('') || '空'}</div>
            <div class="add-skill-form">
              <h4>添加技能</h4>
              <div class="add-skill-row"><div class="field" style="flex:1;margin:0;"><input type="text" id="newSkillName" placeholder="技能名称"></div><div class="field" style="flex:1;margin:0;"><select id="newSkillDep"><option value="none">无依赖</option><option value="required">强依赖</option><option value="optional">弱依赖</option></select></div></div>
              <div class="add-skill-row" id="newItemRow" style="display:none;"><input type="text" id="newSkillItem" placeholder="物品名(多个逗号隔开)"></div>
              <button class="btn primary" id="addSkillBtn">录入</button>
            </div>
          </div>`;
        libBody.querySelectorAll('.lib-class-btn').forEach(b => b.onclick = e => { currentLibClass = e.target.dataset.class; renderLib(); });
        $('newSkillDep').onchange = e => $('newItemRow').style.display = e.target.value === 'none' ? 'none' : 'flex';
        $('addSkillBtn').onclick = () => {
          const n = $('newSkillName').value.trim(); const dep = $('newSkillDep').value; const it = $('newSkillItem').value.trim();
          if (!n) return toast('请输入名称', 'warn'); if (dep === 'required' && !it) return toast('强依赖必须填物品', 'warn');
          const items = dep !== 'none' && it ? it.split(/[,，]/).map(i => i.trim()).filter(Boolean) : [];
          db.library[currentLibClass].push({ id: Date.now().toString(), name: n, depType: dep, items });
          save(); renderLib(); toast('已录入', 'ok');
        };
        libBody.querySelectorAll('[data-del-skill]').forEach(b => b.onclick = e => { db.library[currentLibClass] = db.library[currentLibClass].filter(s => s.id !== e.target.dataset.delSkill); save(); renderLib(); });
      } 
      else if (currentLibTab === 'data') {
        libBody.innerHTML = `
          <div style="flex:1;padding:20px;overflow-y:auto;">
            <h4>资料库备份 (不含战术)</h4>
            <button class="btn primary block" id="genCodeBtn" style="margin:10px 0;">📋 生成资料库代码</button>
            <textarea id="dataCodeText" rows="6" placeholder="生成或粘贴资料库代码..." style="font-family:monospace;"></textarea>
            <button class="btn block" id="restoreCodeBtn" style="margin-top:10px;color:var(--warn);border-color:var(--warn);">🔄 恢复数据 / 载入分享码</button>
          </div>`;
        $('genCodeBtn').onclick = () => {
          const str = LZString.compressToEncodedURIComponent(JSON.stringify({ library: db.library, roster: db.roster }));
          $('dataCodeText').value = str; $('dataCodeText').select(); document.execCommand('copy'); toast('资料库代码已复制', 'ok');
        };
        $('restoreCodeBtn').onclick = () => {
          let code = $('dataCodeText').value.replace(/\s+/g, ''); if (!code) return toast('粘贴代码', 'warn');
          try {
            let decompressed = '';
            try { decompressed = LZString.decompressFromEncodedURIComponent(code); } catch(e) {}
            if (!decompressed || !decompressed.startsWith('{')) decompressed = decodeURIComponent(atob(code)); // 兼容老版
            
            const parsed = cleanData(JSON.parse(decompressed));
            if (parsed.players) { 
              Object.assign(db, parsed); save(); toast('战术已载入', 'ok'); setTimeout(() => location.reload(), 1000);
            } else { 
              if (parsed.library) db.library = parsed.library;
              if (parsed.roster?.length) db.roster = parsed.roster;
              save(); toast('资料库恢复成功', 'ok'); setTimeout(() => location.reload(), 1000);
            }
          } catch(e) { toast('代码损坏', 'error'); }
        };
      }
    }

    document.querySelectorAll('.view-tab').forEach(t => t.onclick = () => switchView(t.dataset.view));
    $('openLibBtn').onclick = () => { libMask.classList.add('show'); renderLib(); };
    $('closeLibBtn').onclick = () => libMask.classList.remove('show');
    document.querySelectorAll('.lib-tab').forEach(t => t.onclick = () => { currentLibTab = t.dataset.libtab; renderLib(); });
    
    $('drawerClose').onclick = closeDrawer;
    drawerMask.onclick = closeDrawer;

    deploySandbox.onclick = e => {
      if (isViewMode) return;
      const del = e.target.closest('.del-btn');
      if (del) {
        e.stopPropagation(); const id = del.dataset.del; const p = db.players.find(x => x.id === id);
        db.players = db.players.filter(x => x.id !== id); Object.keys(db.actions).forEach(ph => delete db.actions[ph][id]);
        save(); renderDeploy(); toast(`已移出【${p.name}】`, 'ok'); return;
      }
      const add = e.target.closest('.add-btn');
      if (add) {
        if (db.players.length >= 12) return toast('满编 12 人', 'warn');
        openDrawer(null, add.dataset.add, 'deploy'); return;
      }
      const card = e.target.closest('.player-card');
      if (card) openDrawer(db.players.find(p => p.id === card.dataset.id), null, 'deploy');
    };

    tacticList.onclick = e => {
      if (isViewMode) return;
      const row = e.target.closest('.tactic-row');
      if (row) openDrawer(db.players.find(p => p.id === row.dataset.id), null, 'tactic');
    };

    phaseBar.onclick = e => { if (e.target.classList.contains('phase-btn')) { currentPhase = e.target.dataset.phase; renderTactics(); } };
    $('phaseSettingsBtn').onclick = () => {
      $('phaseCheckboxes').innerHTML = ALL_PHASES.map(p => `<label class="radio" style="width:60px;"><input type="checkbox" value="${p}" ${db.activePhases.includes(p)?'checked':''}> ${p}</label>`).join('');
      $('phaseMask').classList.add('show');
    };
    $('closePhaseBtn').onclick = () => $('phaseMask').classList.remove('show');
    $('savePhaseBtn').onclick = () => {
      const ck = [...document.querySelectorAll('#phaseCheckboxes input:checked')].map(i => i.value);
      if (!ck.length) return toast('至少留一个', 'warn');
      db.activePhases = ALL_PHASES.filter(p => ck.includes(p)); if (!ck.includes(currentPhase)) currentPhase = ck[0];
      save(); renderTactics(); $('phaseMask').classList.remove('show');
    };

    $('dungeonName').oninput = e => { db.dungeonName = e.target.value; save(); };
    $('resetBtn').onclick = () => { if(confirm('确定清空？')) { localStorage.removeItem(STORAGE_KEY); location.reload(); } };
    
    // 【核心更新】极速压缩生成分享链接
    $('shareBtn').onclick = () => {
      const usedC = new Set(db.players.map(p => p.class)); const slimLib = {};
      usedC.forEach(c => { if (db.library[c]) slimLib[c] = db.library[c]; });
      const dataToShare = { dungeonName: db.dungeonName, activePhases: db.activePhases, players: db.players, actions: db.actions, library: slimLib };
      
      // 使用极速压缩算法，长度减少 70%
      const str = LZString.compressToEncodedURIComponent(JSON.stringify(dataToShare));
      
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}#data=${str}`;
      
      $('shareCodeText').value = shareUrl; 
      $('shareMask').classList.add('show');
    };
    
    $('copyShareCodeBtn').onclick = () => { 
      $('shareCodeText').select(); 
      document.execCommand('copy'); 
      toast('✅ 链接已复制！发给队友即可直接打开', 'ok'); 
      $('shareMask').classList.remove('show'); 
    };
    $('closeShareBtn').onclick = () => $('shareMask').classList.remove('show');

    $('exportBtn').onclick = () => {
      const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
      a.download = (db.dungeonName || '战术板') + '_备份.json'; a.click();
    };
    $('importBtn').onclick = () => $('importFile').click();
    $('importFile').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = ev => {
        try { Object.assign(db, cleanData(JSON.parse(ev.target.result))); save(); toast('导入成功', 'ok'); setTimeout(() => location.reload(), 1000); } 
        catch(err) { toast('文件错误', 'error'); }
      }; r.readAsText(f);
    };

    load();
    switchView('deploy');
  </script>
</body>
</html>
